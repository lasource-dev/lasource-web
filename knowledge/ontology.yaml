# Ontologie minimale du Knowledge Core.
# Les listes seront étendues uniquement après validation d'un besoin métier.
entities:
  - Technology
  - Category
  - Source
  - Relation
  - Tutorial
  - Recipe
  - Error
  - Release
  - Comparison

relations:
  - belongs_to_category
  - classifies
  - compatible_with
  - developed_by
  - depends_on
  - uses
  - supports
  - alternative_to
  - integrates_with
  - replaces

entity_relations:
  Technology:
    relations:
      - belongs_to_category
      - supported_by_source
  Category:
    relations:
      - classifies
  Source:
    relations:
      - supports_claim
  Relation:
    endpoints:
      - Technology
    evidence:
      - Source
    constraints:
      - no_self_relation
      - canonical_uniqueness
      - published_evidence_required
