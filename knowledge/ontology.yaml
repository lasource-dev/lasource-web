# Ontologie minimale du Knowledge Core.
# Les listes seront étendues uniquement après validation d'un besoin métier.
entities:
  - Technology
  - Category
  - Source
  - Relation
  - Tutorial
  - Recipe
  - Error
  - Release
  - Comparison

relations:
  - belongs_to_category
  - classifies
  - compatible_with
  - developed_by
  - depends_on
  - uses
  - supports
  - alternative_to
  - integrates_with
  - replaces

entity_relations:
  Technology:
    relations:
      - belongs_to_category
  Category:
    relations:
      - classifies
